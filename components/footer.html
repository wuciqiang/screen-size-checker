        .badge-marquee {
            position: relative;

            margin: 0 auto 18px;

            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            -webkit-mask-image: linear-gradient(to right, transparent 0, #000 6%, #000 94%, transparent 100%);

        }
        .badge-marquee__track {
            display: flex;
            width: max-content;
            align-items: center;
            gap: 34px;
            animation: badge-marquee-scroll 32s linear infinite;
            will-change: transform;
        }
        .badge-marquee:hover .badge-marquee__track,
        .badge-marquee:focus-within .badge-marquee__track {
            animation-play-state: paused;
        }
        .badge-marquee__item {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex: 0 0 auto;
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: inherit;
            opacity: 0.7;
            text-decoration: none;
            white-space: nowrap;
            transition: opacity 0.18s ease;
        }
        .badge-marquee__item:hover { opacity: 1; }
        .badge-marquee__dot {
            width: 5px;
            height: 5px;
            border-radius: 9999px;
            background: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.16);
            flex: 0 0 auto;
        }
        @keyframes badge-marquee-scroll {
            from { transform: translate3d(0, 0, 0); }
            to { transform: translate3d(-50%, 0, 0); }
        }
        @media (max-width: 640px) {
            .badge-marquee__track { gap: 24px; animation-duration: 24s; }
            .badge-marquee__item { font-size: 10px; }
        }
        @media (prefers-reduced-motion: reduce) {
            .badge-marquee__track { animation: none; }
        }
